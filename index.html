<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Fermat</title>
  <meta name="description" content="Project Fermat — coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --ink: #f4f1ea;
      --muted: #8a8778;
      --accent: #e8c547;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Fraunces', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
      gap: 18px;
    }
    h1 {
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: -0.01em;
    }
    .soon {
      color: var(--muted);
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      letter-spacing: 0.02em;
    }
    .initiative {
      margin-top: 6px;
      color: var(--muted);
      font-size: clamp(0.82rem, 2vw, 0.95rem);
      line-height: 1.6;
    }
    .initiative a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(244, 241, 234, 0.25);
      transition: border-color 0.2s ease;
    }
    .initiative a:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <h1>Project Fermat</h1>
  <p class="soon">Coming soon</p>
  <p class="initiative">
    An initiative by
    <a href="https://akshatb.com" target="_blank" rel="noopener">Akshat Bhaskar</a>
    and
    <a href="https://ishaanharish.me" target="_blank" rel="noopener">Ishaan Harish</a>
  </p>
</body>
</html>
